name: Contribution terms

# Fails a pull request from outside Cryptnox whose contribution terms box is
# not ticked. The check itself is the reusable workflow next to this file.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    branches: [main]

permissions: {}

jobs:
  terms:
    uses: embarquech/.github/.github/workflows/contribution-terms.yml@main
