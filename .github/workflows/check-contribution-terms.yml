name: Contribution terms

# Sandbox only. Simulates a pull request that replaces the caller with a no-op
# job reporting the same check name. Must not affect the real check, which
# runs from main on pull_request_target.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    branches: [main]

permissions: {}

jobs:
  terms:
    name: terms / terms
    runs-on: ubuntu-latest
    steps:
      - run: echo "spoofed check, no terms were read"
