name: Contribution terms (test rig)

# Sandbox only. Do not merge.
#
# Copy of contribution-terms.yml with the owner/member/collaborator skip
# removed, so only the new branch test can let a maintainer through. Prints
# the two values it compares.

on:
  workflow_call:

permissions: {}

jobs:
  terms:
    runs-on: ubuntu-latest
    steps:
      - name: Check the contribution terms box
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          ASSOCIATION: ${{ github.event.pull_request.author_association }}
          AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          echo "head repo:      $HEAD_REPO"
          echo "this repo:      $GITHUB_REPOSITORY"
          echo "association:    $ASSOCIATION"
          if [ "$AUTHOR_TYPE" = "Bot" ]; then
            echo "Bot pull request, contribution terms not required."
            exit 0
          fi
          if [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ]; then
            echo "Branch lives in the repository itself, so the author has write access and contributes under an agreement with Cryptnox. Nothing to check."
            exit 0
          fi
          if printf '%s\n' "$PR_BODY" | tr -d '\r' | grep -Eq '^- \[[xX]\] I have read and I accept the \[Cryptnox Contributor Agreement, version 1\.0\]'; then
            echo "Contribution terms accepted."
          else
            echo "::error::Tick the contribution terms box in the pull request description."
            exit 1
          fi
